name: CI

# GitHub-hosted macOS runners do not give jobs a usable Metal GPU, so CI runs
# every check that needs no GPU: version consistency, a compile of every
# source file, both libraries, their exported BLAS symbols, the routing
# unit tests, the built-in routing tables against their filed calibrations,
# the built-in AB_SPLIT tables against their filed evidence and the range
# guard's stage-2 tests. The GPU suites run locally with
# `make ci-local` before a release
# (docs/RELEASING.md). The two images carry different Xcode versions and SDKs;
# the Toolchain step prints which one each job used. GitHub retires the
# macos-14 image on November 2, 2026. Its job was the only one that built
# against the macOS 14 SDK, which has no MTLMathModeSafe (the shaders get
# fastMathEnabled = NO there); no job builds against that SDK now.

on:
  push:
    branches: [ main ]
  # Feature work merges into a release/* branch before that branch's own PR
  # into main, so PRs into release branches get the same checks.
  pull_request:
    branches: [ main, 'release/**' ]

permissions:
  contents: read

jobs:
  build:
    name: Build and routing tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, macos-26 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Toolchain
      run: |
        sw_vers
        echo "SDK $(xcrun --show-sdk-version)"
        clang --version | head -1

    - name: Version consistency
      run: make version-check

    - name: Compile every source file
      run: make build-check

    - name: Build static and shared libraries
      run: make lib

    - name: Exported BLAS symbols
      run: make test-symbols

    - name: Routing unit tests (no GPU)
      run: make build/test_dispatch && ./build/test_dispatch

    - name: Built-in routing tables match the filed calibrations
      run: make dispatch-table-check

    - name: Built-in split tables match their filed evidence
      run: make split-table-check

    - name: Range guard stage-2 tests (no GPU)
      run: make build/test_range_guard && ./build/test_range_guard
